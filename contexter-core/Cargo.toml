[package]
name = "contexter-core"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
rocksdb = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
lru = "0.12"
thiserror = "1"
tracing = "0.1"
sha2 = "0.10"
similar = "2"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"], optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
zstd = { version = "0.13", optional = true }
lz4 = { version = "1.24", optional = true }

[features]
default = ["compression"]
compression = ["zstd", "lz4"]
python = ["pyo3"]

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# PyO3 v0.22 #[pymethods] proc macro wraps return types in PyResult
# automatically, making explicit PyResult<T> returns a "useless conversion"
# of PyErr → PyErr. This is a known interaction and not a real concern.
useless_conversion = "allow"

[lib]
name = "contexter_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "contexter"
path = "src/bin/cli/mod.rs"

