[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contexter-server"
version = "0.1.0"
description = "Python API and management layer for the Contexter agent memory system"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=0.3",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0,<3",
    "structlog>=0.24",
    "pyyaml>=6.0",
    "click>=8.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "maturin>=1,<2",
    "httpx>=0.28",
]

[project.scripts]
contexter = "contexter_server.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["contexter_server"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
